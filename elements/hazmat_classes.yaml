# Reusable catalog of hazardous material / compliance classifications.
# Referenced by structure/items.yaml's hazmat_classes[]. A separate copy
# from Topology-as-Code's own elements/hazmat_classes.yaml (that one
# constrains storage_type compatibility; this one classifies the item
# itself) - deliberately duplicated per the family's "don't extract
# prematurely" principle, see README "Shared Vocabulary".

hazmat_classes:
  - id: "GHS02_FLAMMABLE"
    description: "Flammable liquids/solids (GHS pictogram 02)"

  - id: "GHS05_CORROSIVE"
    description: "Corrosive substances (GHS pictogram 05)"

  - id: "GHS06_TOXIC"
    description: "Acute toxicity (GHS pictogram 06)"

  - id: "GHS09_ENVIRONMENT"
    description: "Hazardous to the aquatic environment (GHS pictogram 09)"
