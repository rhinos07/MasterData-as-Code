# Category-level file. Short and stable - references everything else.
# Validates against schemas/category.schema.json

api_version: "masterdata-as-code/v1"

category:
  id: "beverages"
  name: "Beverages"

  default_attributes:
    default_uom: "each"   # inherited by items below that don't set their own
    storage_condition: "ambient"
    # Inherited field by field - an item overrides only what differs.
    # Example values, not taken from a real customer.
    tracking:
      lot: "required"
      expiry:
        tracked: true
        min_remaining_at_receipt_days: 90
        total_shelf_life_days: 365
      serial:
        capture: "none"

  imports:
    - "structure/items.yaml"
    - "structure/packaging.yaml"
    - "strategies/sourcing.yaml"
    - "strategies/lifecycle.yaml"
